name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_API_BASE_URL: https://melfis.vercel.app

      - name: Sync with Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Payload and IPA
        run: |
          mkdir -p ios/build/Payload
          cp -r ios/build/App.xcarchive/Products/Applications/App.app ios/build/Payload/
          cd ios/build
          zip -r MelfisFlowers.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melfis-flower-shop-ios-ipa
          path: ios/build/MelfisFlowers.ipa

